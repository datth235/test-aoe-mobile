<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#102b29" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Ages of Dominion</title>
  </head>
  <body>
    <main id="game" aria-label="Ages of Dominion isometric game"></main>
    <div id="start-screen" class="overlay">
      <div class="start-card">
        <p class="eyebrow">ORIGINAL STRATEGY · MILESTONE 01</p>
        <h1>Ages of<br /><span>Dominion</span></h1>
        <p>Every empire begins with a place to call home.</p>
        <button id="start-button" type="button">Tap to start <span>→</span></button
        ><small>Explore your land · Drag to pan · Pinch to zoom</small>
      </div>
    </div>
    <div id="rotate-screen" class="overlay" hidden>
      <div class="rotate-card">
        <span class="rotate-symbol">↻</span>
        <h2>Please rotate your device</h2>
        <p>Your dominion looks better in landscape.</p>
      </div>
    </div>
    <button id="update-toast" class="toast" type="button" hidden>
      New version available – tap to reload
    </button>
    <div id="fullscreen-notice" class="fullscreen-notice" role="status" hidden></div>
    <div id="fatal-error" class="overlay" hidden>
      <p>Unable to start the game. Reload the page and try again.</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
